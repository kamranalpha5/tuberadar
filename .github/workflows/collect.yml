name: Collect trending data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run collector
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/collect.mjs
      - name: Commit data
        run: |
          git config user.name "tuberadar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trending.json
          git diff --staged --quiet || git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
